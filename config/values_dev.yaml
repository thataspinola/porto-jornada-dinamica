appFramework: react
ingress:
  enabled: true
  contextURL: /contrate
  host: "dynamic-form.hub-de-vendas-ecommerce.dev.awsporto"

namespace: corp-hubv
containerPort: 3000

hpa:
  enabled: true
  enableMemory: false
  enableCpu: true
  #Número mínimo de PODS
  minReplicas: 1
  #Número máximo de PODS
  maxReplicas: 2
  #Porcentagem de média para escalar o POD (Quando bater a média de consumo o POD escala!), melhores detalhes consultar a documentação.
  targetMemoryUtilizationPercentage: 85
  targetCpuUtilizationPercentage: 85

resources:
  cpu: 250m
  memory: 500Mi

# Habilita ou não as secrets que são "puxadas" através do Backstage
enable_secrets: true
secrets:
  RECAPTCHA: 82b537ba-4d7e-4392-9942-6e1cebb1264e
  GTM-ENCRYPTION: 48e1a3e8-8f86-4780-9385-4d24d2f17acc

configmap:
  profile: "dev"
  NEXT_PUBLIC_ENVIRONMENT: "development"
  NEXT_PUBLIC_ORGANIZATION_ID: "6T4XUGKR"
  NEXT_PUBLIC_NODE_ENV: "development"
  NEXT_PUBLIC_RECAPTCHA_SITE_K: "6LdNVNwqAAAAAJEgi_TYTi7FyD6BIpCIePUC2vAL"
  NEXT_PUBLIC_SENSEDIA_CLOUD_URL: "https://portoapicloud-hml.portoseguro.brasil"
  NEXT_PUBLIC_COOKIE_DOMAIN: ".portoseguro.com.br"
  NEXT_PUBLIC_IP_SERVICE: "https://www.portoseguro.com.br/content/rest/commerce/get/global/client-ip"
  NEXT_PUBLIC_JORNADA_DINAMICA: "hub-vendas/cliente/v1/jornada-dinamica"
  NEXT_PUBLIC_GA_COOKIE_SESSION_ID: "PGMXQZ7PG8"
