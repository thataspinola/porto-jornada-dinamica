appFramework: react
ingress:
  enabled: true
  contextURL: /contrate
  host: "dynamic-form.hub-de-vendas-ecommerce.hml.awsporto"

namespace: corp-hubv
containerPort: 3000

hpa:
  enabled: true
  enableMemory: false
  enableCpu: true
  minReplicas: 1
  maxReplicas: 2
  targetCpuUtilizationPercentage: 85

resources:
  cpu: 250m
  memory: 500Mi

# Habilita ou não as secrets que são "puxadas" através do Backstage
