appFramework: react
ingress:
  enabled: true
  contextURL: /contrate
  host: dinamic-journey.apps.hub-de-vendas-ecommerce.prd.awsporto

namespace: corp-hubv
containerPort: 3000

hpa:
  enabled: true
  enableMemory: true
  enableCpu: true
  minReplicas: 3
  maxReplicas: 10
  targetCpuUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 85

resources:
  cpu: 250m
  memory: 250Mi

