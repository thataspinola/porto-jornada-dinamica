pre-commit:
  parallel: true
  jobs:
    - name: biome
      tags:
        - frontend
        - quality
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true

    - name: stylelint
      tags:
        - frontend
        - quality
      glob: "*.scss"
      run: npm run lint:style {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: conventional-commits
      run: node scripts/check-commits.mjs --file "{1}"

pre-push:
  parallel: false
  jobs:
    - name: structure-and-docs
      run: npm run check:imports && npm run check:empty && npm run check:names && npm run check:journeys && npm run docs:check

    - name: type-check
      tags:
        - frontend
        - quality
      run: npm run type-check

    - name: test
      tags:
        - frontend
        - unit tests
        - integration tests
      run: npm run test:coverage

    - name: build
      tags:
        - frontend
        - build project
      run: npm run build
